fallback_provider: spacepayments
simulation_seed: 1
status_check:
  enabled: true
  initial_delay_sec: 5
  retry_delays_sec: [5, 15, 30, 60, 120]
  max_attempts: 10

hard_constraints:
  default_requests_per_minute_limit: null

metrics:
  window:
    max_observations: 50
    recent_observations: 10
  smoothing:
    prior_strength: 10.0
    approval_prior: 0.5
    timeout_prior: 0.10
    timeout_prior_strength: 5.0
    segment_min_size: 5
    segment_confidence_strength: 10.0
  combination: weighted_sum
  components:
    approval_rate:
      enabled: true
      weight: 0.40
    availability:
      enabled: true
      weight: 0.25
    acceptance:
      enabled: true
      weight: 0.15
    latency:
      enabled: true
      weight: 0.20
      bad_p90_sec: 600
  multipliers:
    health:
      enabled: true
      floor: 0.25
      exponent: 1.0
      availability_weight: 0.60
      acceptance_weight: 0.40

# Nested combinations:
#   metric   → observable (session, catalog, window, runtime, operation)
#   strategy → combination of metrics → score in [-1, 1]
#   profile  → combination of strategies → base = Σ w_strategy × s_strategy
#   total    = base × health   (health is also a metric combination)
#
# Window components under metrics: are metrics too; historical_quality is the
# strategy that combines them. conversion still uses conversion_24h.
# To add a metric that should affect selection: register it in
# Metrics::Inputs, produce the value, then list it on a SoftGoals::*::METRICS
# (existing strategy or a new class on GOALS).
#
# There are two mutually exclusive ways to select strategies:
# 1. Enable one or more strategies directly and do not select any profiles.
# 2. Disable every direct strategy, select a default profile, and optionally
#    assign another profile to a specific provider.
active_profile: balanced

provider_profiles:
  vipay: reliable_history
  payflow: controlled_share
  quickpay: capacity_obligation

strategies:
  count_share:
    enabled: false
    weight: 0.30
  volume_share:
    enabled: false
    weight: 0.20
  conversion:
    enabled: false
    weight: 0.20
  historical_quality:
    enabled: false
    weight: 0.30
  cascade_priority:
    enabled: false
    weight: 0.10
  amount_band:
    enabled: false
    weight: 0.10
  financial_obligation:
    enabled: false
    weight: 0.05
  load_balance:
    enabled: false
    weight: 0.05

profiles:
  balanced:
    strategies:
      count_share:
        weight: 0.25
      volume_share:
        weight: 0.15
      conversion:
        weight: 0.15
      historical_quality:
        weight: 0.20
      cascade_priority:
        weight: 0.10
      amount_band:
        weight: 0.05
      financial_obligation:
        weight: 0.05
      load_balance:
        weight: 0.05
  historical_only:
    strategies:
      historical_quality:
        weight: 1.0
  conversion_first:
    strategies:
      conversion:
        weight: 0.60
      count_share:
        weight: 0.20
      volume_share:
        weight: 0.10
      load_balance:
        weight: 0.10
  cascade:
    strategies:
      cascade_priority:
        weight: 1.0
  reliable_history:
    strategies:
      historical_quality:
        weight: 0.35
      conversion:
        weight: 0.25
      count_share:
        weight: 0.10
      volume_share:
        weight: 0.15
      load_balance:
        weight: 0.10
      financial_obligation:
        weight: 0.05
    metrics:
      components:
        availability:
          weight: 0.40
      multipliers:
        health:
          exponent: 1.5
  controlled_share:
    strategies:
      volume_share:
        weight: 0.45
      historical_quality:
        weight: 0.30
      conversion:
        weight: 0.05
      count_share:
        weight: 0.05
      load_balance:
        weight: 0.10
      cascade_priority:
        weight: 0.05
  capacity_obligation:
    strategies:
      financial_obligation:
        weight: 0.30
      historical_quality:
        weight: 0.25
      load_balance:
        weight: 0.20
      volume_share:
        weight: 0.15
      count_share:
        weight: 0.05
      conversion:
        weight: 0.05
