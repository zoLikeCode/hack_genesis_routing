fallback_provider: spacepayments
simulation_seed: 1

status_check:
  enabled: true
  initial_delay_sec: 5
  retry_delays_sec: [5, 15, 30, 60]
  max_attempts: 5

circuit_breaker:
  enabled: true
  unresolved_count_limit: 5
  unresolved_amount_limit: 500000

# Mandatory eligibility rules. Strategies never override these constraints.
hard_constraints:
  default_requests_per_minute_limit: null

# One quality estimate: probability of receiving approved on the initial call.
# The published conversion_24h is a regularizing prior, not a second score.
metrics:
  window:
    max_observations: 50
    lookback_hours: 24
  smoothing:
    prior_strength: 10.0
    default_conversion_prior: 0.5
    segment_min_size: 10
    segment_prior_strength: 10.0

# Inclusive upper bounds. The final band must be open-ended.
amount_bands:
  - max: 50000
    providers: [payflow, vipay, quickpay]
  - max: 100000
    providers: [vipay, quickpay, payflow]
  - max: null
    providers: [quickpay, vipay, payflow]

# Direct mode and profile mode are mutually exclusive. In direct mode set
# active_profile to null, remove provider_profiles, and enable one or more
# strategies here. Enabled weights are normalized automatically.
active_profile: balanced

provider_profiles:
  vipay: reliable_history
  payflow: controlled_share
  quickpay: capacity_obligation

strategies:
  conversion: { enabled: false, weight: 1.0 }
  count_share: { enabled: false, weight: 1.0 }
  volume_share: { enabled: false, weight: 1.0 }
  load_balance: { enabled: false, weight: 1.0 }
  financial_obligation: { enabled: false, weight: 1.0 }
  cascade_priority: { enabled: false, weight: 1.0 }
  amount_band: { enabled: false, weight: 1.0 }

profiles:
  balanced:
    strategies:
      conversion: { weight: 0.65 }
      count_share: { weight: 0.10 }
      volume_share: { weight: 0.10 }
      load_balance: { weight: 0.10 }
      financial_obligation: { weight: 0.05 }
  reliable_history:
    strategies:
      conversion: { weight: 0.75 }
      count_share: { weight: 0.05 }
      volume_share: { weight: 0.05 }
      load_balance: { weight: 0.10 }
      financial_obligation: { weight: 0.05 }
  controlled_share:
    strategies:
      conversion: { weight: 0.65 }
      count_share: { weight: 0.05 }
      volume_share: { weight: 0.20 }
      load_balance: { weight: 0.05 }
      financial_obligation: { weight: 0.05 }
  capacity_obligation:
    strategies:
      conversion: { weight: 0.65 }
      count_share: { weight: 0.025 }
      volume_share: { weight: 0.025 }
      load_balance: { weight: 0.15 }
      financial_obligation: { weight: 0.15 }

  only_conversion:
    strategies: { conversion: { weight: 1.0 } }
  only_count_share:
    strategies: { count_share: { weight: 1.0 } }
  only_volume_share:
    strategies: { volume_share: { weight: 1.0 } }
  only_load_balance:
    strategies: { load_balance: { weight: 1.0 } }
  only_financial_obligation:
    strategies: { financial_obligation: { weight: 1.0 } }
  only_cascade_priority:
    strategies: { cascade_priority: { weight: 1.0 } }
  only_amount_band:
    strategies: { amount_band: { weight: 1.0 } }

concurrency:
  enabled: true
  executor: fiber_pool
  fallback_worker_limit: 4
  max_workers_per_provider: null
  status_worker_limit: 8
  persist_debounce_ms: 50
  event_log: false
